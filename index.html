<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Premium Vehicle Report Generator</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*{box-sizing:border-box}

:root{
    --bg:#07101d;
    --panel:#0c1727;
    --panel2:#111f32;
    --border:rgba(255,255,255,.09);
    --text:#edf5ff;
    --muted:#8ea2ba;
    --accent:#4da3ff;
    --accent2:#755cff;
    --green:#35d99b;
    --red:#ff6879;
}

body{
    margin:0;
    min-height:100vh;
    background:
        radial-gradient(circle at 10% 0%,rgba(77,163,255,.13),transparent 30%),
        radial-gradient(circle at 90% 10%,rgba(117,92,255,.13),transparent 30%),
        linear-gradient(135deg,#050b13,#081525,#050b13);
    color:var(--text);
    font-family:Inter,Arial,Helvetica,sans-serif;
}

.app{
    width:min(1100px,94%);
    margin:auto;
    padding:35px 0 60px;
}

.top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:22px;
}

.brand{
    display:flex;
    align-items:center;
    gap:13px;
}

.logo{
    width:46px;
    height:46px;
    border-radius:14px;
    display:grid;
    place-items:center;
    font-size:16px;
    font-weight:900;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:0 12px 35px rgba(77,163,255,.25);
}

.brand h1{
    margin:0;
    font-size:20px;
}

.brand p{
    margin:3px 0 0;
    color:var(--muted);
    font-size:11px;
}

.badge{
    padding:8px 13px;
    border:1px solid var(--border);
    background:rgba(255,255,255,.04);
    border-radius:50px;
    font-size:10px;
    color:#afc1d6;
}

.editor{
    background:rgba(10,22,37,.88);
    border:1px solid var(--border);
    border-radius:23px;
    padding:22px;
    box-shadow:0 25px 80px rgba(0,0,0,.35);
    backdrop-filter:blur(15px);
}

.editor h2{
    margin:0;
    font-size:17px;
}

.editor p{
    margin:6px 0 15px;
    color:var(--muted);
    font-size:12px;
}

textarea{
    width:100%;
    min-height:430px;
    resize:vertical;
    padding:18px;
    border-radius:15px;
    outline:none;
    border:1px solid rgba(255,255,255,.08);
    background:#050c16;
    color:#dcecff;
    font-family:Consolas,monospace;
    font-size:12px;
    line-height:1.6;
}

textarea:focus{
    border-color:rgba(77,163,255,.5);
    box-shadow:0 0 0 4px rgba(77,163,255,.07);
}

.actions{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-top:14px;
    flex-wrap:wrap;
}

.action-group{
    display:flex;
    gap:8px;
}

button{
    border:0;
    cursor:pointer;
    font-family:inherit;
}

.btn{
    padding:12px 17px;
    border-radius:11px;
    font-size:12px;
    font-weight:800;
}

.primary{
    color:white;
    background:linear-gradient(135deg,#428ff2,#7159ef);
    box-shadow:0 10px 28px rgba(70,100,240,.22);
}

.secondary{
    color:#d5e5f7;
    background:rgba(255,255,255,.05);
    border:1px solid var(--border);
}

#status{
    color:var(--muted);
    font-size:11px;
}

#status.ok{color:var(--green)}
#status.error{color:var(--red)}

.loader{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(2,6,12,.8);
    backdrop-filter:blur(7px);
    z-index:99999;
}

.loader.show{display:flex}

.loader-box{
    background:#0d1b2d;
    border:1px solid var(--border);
    padding:25px;
    border-radius:18px;
    text-align:center;
}

.spinner{
    width:32px;
    height:32px;
    margin:0 auto 13px;
    border-radius:50%;
    border:3px solid rgba(255,255,255,.12);
    border-top-color:#5aa8ff;
    animation:spin .75s linear infinite;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}


/* ======================================================
   PDF AREA
   EXACT A4 RATIO
====================================================== */

#pdfRoot{
    position:absolute;
    left:-100000px;
    top:0;
}

.pdf{
    width:794px;
    height:1123px;
    background:#f4f7fb;
    color:#162238;
    position:relative;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
}

/* Top accent */

.pdf:before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:6px;
    background:linear-gradient(90deg,#1769d1,#5c4ce5,#1769d1);
}

/* Header */

.pdf-header{
    height:145px;
    padding:27px 32px 20px;
    background:
        linear-gradient(135deg,#091728,#122a47);
    color:white;
    position:relative;
    overflow:hidden;
}

.pdf-header:after{
    content:"";
    position:absolute;
    width:330px;
    height:330px;
    border-radius:50%;
    right:-110px;
    top:-190px;
    border:1px solid rgba(255,255,255,.08);
    box-shadow:
        0 0 0 35px rgba(255,255,255,.018),
        0 0 0 70px rgba(255,255,255,.014);
}

.header-content{
    position:relative;

    display:flex;
    justify-content:space-between;
    gap:25px;
}

.small-title{
    color:#91b8df;
    font-size:8px;
    letter-spacing:2px;
    text-transform:uppercase;
    font-weight:bold;
}

.pdf-title{
    margin-top:7px;
    font-size:27px;
    font-weight:900;
    letter-spacing:-.8px;
}

.pdf-subtitle{
    margin-top:6px;

    font-size:9px;
}

.plate{

    flex-direction:column;

    justify-content:center;

}

.plate-label{
    font-size:7px;
    font-weight:800;
    letter-spacing:1.5px;
}

.plate-number{
    font-size:20px;
    font-weight:900;
    letter-spacing:1.5px;
    margin-top:2px;
}


/* Identity */

.identity{
    margin:18px 32px 0;
    height:104px;
    background:white;
    border:1px solid #e1e7ef;
    border-radius:14px;
    box-shadow:0 8px 24px rgba(24,44,70,.06);
    padding:16px 18px;
}

.identity-top{
    display:flex;
    justify-content:space-between;
    gap:15px;
}

.identity-label{
    font-size:7px;
    color:#7d8da2;
    letter-spacing:1.3px;
    text-transform:uppercase;
    font-weight:bold;
}

.identity-model{
    font-size:19px;
    font-weight:900;
    color:#142237;
    margin-top:3px;
}

.identity-maker{
    font-size:8px;
    color:#66778c;
    margin-top:3px;
}

.identity-pills{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    justify-content:flex-end;
}

.pill{
    background:#edf4fc;

    font-size:7px;

}

.identity-stats{
    display:grid;

}

.identity-stat{
    border-left:2px solid #d9e7f6;

}

.identity-stat span{
    display:block;
    font-size:6.5px;
    color:#8795a7;
    text-transform:uppercase;
}

.identity-stat strong{
    display:block;
    font-size:8px;
    color:#22334a;
    margin-top:3px;
}


/* Main grid */

.main{
    margin:15px 32px 0;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.panel{
    background:white;
    border:1px solid #e1e7ef;
    border-radius:12px;
    overflow:hidden;
}

.panel-head{
    height:29px;
    background:#f2f6fa;
    border-bottom:1px solid #e3e8ee;
    display:flex;
    align-items:center;
    gap:7px;
    padding:0 11px;
}

.panel-dot{
    width:5px;
    height:15px;
    border-radius:5px;
    background:linear-gradient(#378ce9,#7259e8);
}

.panel-head span{
    font-size:7.5px;
    text-transform:uppercase;
    letter-spacing:1px;
    font-weight:900;
    color:#34465d;
}

.panel-body{
    padding:9px 10px 10px;
}

.field{
    display:grid;
    grid-template-columns:43% 57%;
    min-height:25px;
    border-bottom:1px solid #edf0f4;
    align-items:center;
}

.field:last-child{
    border-bottom:0;
}

.field-label{
    font-size:6.7px;
    text-transform:uppercase;
    letter-spacing:.45px;
    color:#8492a3;
    padding:4px 5px 4px 0;
    line-height:1.2;
}

.field-value{
    font-size:7.6px;
    font-weight:700;
    color:#1e2e43;
    padding:4px 0 4px 5px;
    line-height:1.25;
    word-break:break-word;
}

.field-value.na{
    color:#9ca7b4;
    font-weight:600;
}


/* Bottom wide sections */

.bottom{
    margin:10px 32px 0;
}

.wide{
    background:white;
    border:1px solid #e1e7ef;
    border-radius:12px;
    overflow:hidden;
    margin-bottom:9px;
}

.wide-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
}

.address{
    padding:9px 11px 11px;
    font-size:8px;
    color:#34455a;
    line-height:1.45;
    min-height:44px;
}


/* Footer */

.pdf-footer{
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    height:35px;
    background:#eaf0f6;
    border-top:1px solid #dce3eb;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 32px;
    color:#77879a;
    font-size:6.7px;
}

.pdf-footer strong{
    color:#43566e;
}


/* Mobile editor */

@media(max-width:650px){

    .app{
        width:94%;
        padding-top:22px;
    }

    .badge{
        display:none;
    }

    .editor{
        padding:16px;
        border-radius:18px;
    }

    textarea{
        min-height:390px;
    }

    .actions{
        flex-direction:column;
        align-items:stretch;
    }

    .action-group{
        width:100%;
    }

    .action-group .btn{
        flex:1;
    }
}
</style>
</head>

<script>

/* =====================================================
   LABELS
===================================================== */

const LABELS = {

REGISTRATION_NUMBER:"Registration Number",
OWNER_NAME:"Owner Name",
MOBILE_NUMBER:"Mobile Number",
FATHER_NAME:"Father's Name",
OWNER_NUMBER:"Owner Number",

MAKER:"Manufacturer",
MODEL:"Model",
VEHICLE_CATEGORY:"Vehicle Category",
VEHICLE_CLASS:"Vehicle Class",
BODY_TYPE:"Body Type",
COLOUR:"Colour",
FUEL_TYPE:"Fuel Type",

ENGINE_NUMBER:"Engine Number",
CHASSIS_NUMBER:"Chassis Number",
MANUFACTURING_MONTH:"Manufacturing Month",

SEATING_CAPACITY:"Seating Capacity",
CUBIC_CAPACITY:"Cubic Capacity",
UNLADEN_WEIGHT:"Unladen Weight",
GROSS_VEHICLE_WEIGHT:"Gross Vehicle Weight",
WHEELBASE:"Wheelbase",

RTO_NAME:"RTO",
STATE:"State",
PINCODE:"Pincode",

TRANSMISSION_TYPE:"Transmission",
MAX_POWER:"Maximum Power",
MAX_TORQUE:"Maximum Torque",
NO_OF_CYLINDERS:"Cylinders",
FUEL_TANK_CAPACITY:"Fuel Tank Capacity",
BOOT_SPACE:"Boot Space",
TYRE_SIZE:"Tyre Size",

INSURANCE_COMPANY:"Insurance Company",
INSURANCE_POLICY_NUMBER:"Insurance Policy Number",
INSURANCE_VALIDITY:"Insurance Validity",

PUC_NUMBER:"PUC Number",
PUC_UPTO:"PUC Valid Until",

HYPOTHECATION:"Hypothecation",

REGISTRATION_DATE:"Registration Date",
REGISTRATION_VALIDITY:"Registration Validity",

EMISSION_NORM:"Emission Norm",
TAX_UPTO:"Tax Valid Until",
VEHICLE_AGE:"Vehicle Age",

DETAIL_BY:"Details Prepared By"

};


/* =====================================================
   HELPERS
===================================================== */

function esc(v){

    return String(v ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function value(v){

    if(
        v === undefined ||
        v === null ||
        String(v).trim()===""
    ){
        return "NA";
    }

    return String(v);

}


function label(k){

    return LABELS[k] ||
        k.replace(/_/g," ")
          .toLowerCase()
          .replace(/\b\w/g,c=>c.toUpperCase());

}


function field(k,v){

    const val=value(v);

    const na =
        val.trim().toUpperCase()==="NA";

    return `

        <div class="field">

            <div class="field-label">
                ${esc(label(k))}
            </div>

            <div class="field-value ${na?"na":""}">
                ${esc(val)}
            </div>

        </div>

    `;

}


function panel(title,keys,data){

    const exists =
        keys.filter(k =>
            Object.prototype.hasOwnProperty.call(data,k)
        );

    if(!exists.length)return "";

    return `

        <div class="panel">

            <div class="panel-head">

                <div class="panel-dot"></div>

                <span>${esc(title)}</span>

            </div>

            <div class="panel-body">

                ${exists.map(k=>field(k,data[k])).join("")}

            </div>

        </div>

    `;

}


/* =====================================================
   BUILD SINGLE PAGE
===================================================== */

function buildPDF(data){

    const reg=value(data.REGISTRATION_NUMBER);
    const maker=value(data.MAKER);
    const model=value(data.MODEL);

    const known=Object.keys(LABELS);

    const extras=Object.keys(data)
        .filter(k=>!known.includes(k));


    return `

    <div class="pdf">

        <!-- HEADER -->

        <div class="pdf-header">

            <div class="header-content">

                <div>

                    <div class="small-title">
                        Premium Vehicle Information
                    </div>

                    <div class="pdf-title">
                        VEHICLE PROFILE
                    </div>

                    <div class="pdf-subtitle">
                        Structured vehicle information report
                    </div>

                </div>


                <div class="plate">

                    <div class="plate-label">
                        REGISTRATION NUMBER
                    </div>

                    <div class="plate-number">
                        ${esc(reg)}
                    </div>

                </div>

            </div>

        </div>


        <!-- VEHICLE IDENTITY -->

        <div class="identity">

            <div class="identity-top">

                <div>

                    <div class="identity-label">
                        Vehicle
                    </div>

                    <div class="identity-model">
                        ${esc(model)}
                    </div>

                    <div class="identity-maker">
                        ${esc(maker)}
                    </div>

                </div>


                <div class="identity-pills">

                    <div class="pill">
                        ${esc(value(data.FUEL_TYPE))}
                    </div>

                    <div class="pill">
                        ${esc(value(data.VEHICLE_CATEGORY))}
                    </div>

                    <div class="pill">
                        ${esc(value(data.BODY_TYPE))}
                    </div>

                </div>

            </div>


            <div class="identity-stats">

                <div class="identity-stat">
                    <span>Colour</span>
                    <strong>${esc(value(data.COLOUR))}</strong>
                </div>

                <div class="identity-stat">
                    <span>Engine</span>
                    <strong>${esc(value(data.CUBIC_CAPACITY))}</strong>
                </div>

                <div class="identity-stat">
                    <span>Power</span>
                    <strong>${esc(value(data.MAX_POWER))}</strong>
                </div>

                <div class="identity-stat">
                    <span>Transmission</span>
                    <strong>${esc(value(data.TRANSMISSION_TYPE))}</strong>
                </div>

                <div class="identity-stat">
                    <span>Seats</span>
                    <strong>${esc(value(data.SEATING_CAPACITY))}</strong>
                </div>

            </div>

        </div>


        <!-- MAIN INFORMATION -->

        <div class="main">

            ${panel(
                "Owner Information",
                [
                    "OWNER_NAME",
                    "MOBILE_NUMBER",
                    "FATHER_NAME",
                    "OWNER_NUMBER"
                ],
                data
            )}


            ${panel(
                "Registration & RTO",
                [
                    "REGISTRATION_NUMBER",
                    "REGISTRATION_DATE",
                    "REGISTRATION_VALIDITY",
                    "RTO_NAME",
                    "STATE",
                    "PINCODE",
                    "HYPOTHECATION"
                ],
                data
            )}


            ${panel(
                "Vehicle Classification",
                [
                    "VEHICLE_CATEGORY",
                    "VEHICLE_CLASS",
                    "BODY_TYPE",
                    "COLOUR",
                    "FUEL_TYPE",
                    "MANUFACTURING_MONTH"
                ],
                data
            )}


            ${panel(
                "Engine & Mechanical",
                [
                    "ENGINE_NUMBER",
                    "CHASSIS_NUMBER",
                    "TRANSMISSION_TYPE",
                    "NO_OF_CYLINDERS",
                    "MAX_POWER",
                    "MAX_TORQUE"
                ],
                data
            )}


            ${panel(
                "Dimensions & Capacity",
                [
                    "CUBIC_CAPACITY",
                    "SEATING_CAPACITY",
                    "UNLADEN_WEIGHT",
                    "GROSS_VEHICLE_WEIGHT",
                    "WHEELBASE",
                    "FUEL_TANK_CAPACITY",
                    "BOOT_SPACE",
                    "TYRE_SIZE"
                ],
                data
            )}


            ${panel(
                "Insurance & PUC",
                [
                    "INSURANCE_COMPANY",
                    "INSURANCE_POLICY_NUMBER",
                    "INSURANCE_VALIDITY",
                    "PUC_NUMBER",
                    "PUC_UPTO"
                ],
                data
            )}


            ${panel(
                "Compliance",
                [
                    "EMISSION_NORM",
                    "TAX_UPTO",
                    "VEHICLE_AGE"
                ],
                data
            )}


            ${extras.length
                ? panel(
                    "Additional Information",
                    extras,
                    data
                )
                : ""
            }

        </div>


        <!-- BOTTOM -->

        <div class="bottom">

            <div class="wide">

                <div class="panel-head">

                    <div class="panel-dot"></div>

                    <span>Registered Address</span>

                </div>

                <div class="address">
                    ${esc(value(data.ADDRESS))}

/* =====================================================
   READ JSON
===================================================== */

function getData(){

    const raw=
        document.getElementById("jsonInput")
        .value
        .trim();

    if(!raw){
        throw new Error("Please paste JSON first.");
    }

    let data;

    try{
        data=JSON.parse(raw);
    }
    catch(e){
        throw new Error(
            "Invalid JSON. Please check the JSON format."
        );
    }

    if(
        typeof data!=="object" ||
        data===null ||
        Array.isArray(data)
    ){
        throw new Error(
            "JSON must be a valid object."
        );
    }

    return data;

}


/* =====================================================
   FORMAT
===================================================== */

function formatJSON(){

    const status=
        document.getElementById("status");

    try{

        const data=getData();

        document.getElementById("jsonInput")
            .value=JSON.stringify(data,null,4);

        status.textContent="JSON formatted";
        status.className="ok";

    }
    catch(e){

        status.textContent=e.message;
        status.className="error";

    }

}


/* =====================================================
   CLEAR
===================================================== */

function clearJSON(){

    document.getElementById("jsonInput").value="";

    const status=
        document.getElementById("status");

    status.textContent="Ready";
    status.className="";

}


/* =====================================================
   GENERATE PDF
===================================================== */

async function generatePDF(){

    const loader=
        document.getElementById("loader");

    const status=
        document.getElementById("status");

    try{

        const data=getData();

        loader.classList.add("show");

        status.textContent=
            "Creating single-page report...";

        status.className="";


        const root=
            document.getElementById("pdfRoot");

        root.innerHTML=
            buildPDF(data);


        await new Promise(
            r=>setTimeout(r,300)
        );


        const page=
            root.querySelector(".pdf");


        /*
          scale 2 gives much better PDF quality
          while retaining exact A4 dimensions.
        */

        const canvas=
            await html2canvas(
                page,
                {
                    scale:2,
                    useCORS:true,
                    backgroundColor:"#f4f7fb",
                    logging:false,
                    width:794,
                    height:1123
                }
            );


        status.textContent=
            "Preparing PDF...";


        const {
            jsPDF
        }=window.jspdf;


        const pdf=
            new jsPDF({
                orientation:"portrait",
                unit:"mm",
                format:"a4",
                compress:true
            });


        const image=
            canvas.toDataURL(
                "image/jpeg",
                .96
            );


        pdf.addImage(
            image,
            "JPEG",
            0,
            0,
            210,
            297,
            undefined,
            "FAST"
        );


        let registration=
            value(data.REGISTRATION_NUMBER)
            .replace(/[^a-zA-Z0-9_-]/g,"_");


        pdf.save(
            `Vehicle_Report_${registration}.pdf`
        );


        status.textContent=
            "Premium single-page PDF generated ✓";

        status.className="ok";

    }
    catch(e){

        console.error(e);

        status.textContent=
            e.message || "Generation failed";

        status.className="error";

        alert(
            e.message || "Unable to generate PDF."
        );

    }
    finally{

        setTimeout(
            ()=>loader.classList.remove("show"),
            350
        );

    }

}


/* =====================================================
   CTRL + ENTER
===================================================== */

document
    .getElementById("jsonInput")
    .addEventListener(
        "keydown",
        function(e){

            if(
                (e.ctrlKey || e.metaKey) &&
                e.key==="Enter"
            ){

                e.preventDefault();

                generatePDF();

            }

        }
    );

</script>
