<script>


/* =========================================================
   LABELS
========================================================= */

const LABELS = {

    REGISTRATION_NUMBER:"Registration Number",
    OWNER_NAME:"Owner Name",
    MOBILE_NUMBER:"Mobile Number",
    FATHER_NAME:"Father's Name",
    OWNER_NUMBER:"Owner Number",

    MAKER:"Manufacturer",
    MODEL:"Model",
    VEHICLE_CATEGORY:"Vehicle Category",
    VEHICLE_CLASS:"Vehicle Class",
    BODY_TYPE:"Body Type",
    COLOUR:"Colour",
    FUEL_TYPE:"Fuel Type",

    ENGINE_NUMBER:"Engine Number",
    CHASSIS_NUMBER:"Chassis Number",
    MANUFACTURING_MONTH:"Manufacturing Month",

    SEATING_CAPACITY:"Seating Capacity",
    CUBIC_CAPACITY:"Cubic Capacity",
    UNLADEN_WEIGHT:"Unladen Weight",
    GROSS_VEHICLE_WEIGHT:"Gross Vehicle Weight",
    WHEELBASE:"Wheelbase",

    RTO_NAME:"RTO Name",
    STATE:"State",
    PINCODE:"Pincode",

    TRANSMISSION_TYPE:"Transmission",
    MAX_POWER:"Maximum Power",
    MAX_TORQUE:"Maximum Torque",
    NO_OF_CYLINDERS:"Cylinders",
    FUEL_TANK_CAPACITY:"Fuel Tank Capacity",
    BOOT_SPACE:"Boot Space",
    TYRE_SIZE:"Tyre Size",

    INSURANCE_COMPANY:"Insurance Company",
    INSURANCE_POLICY_NUMBER:"Policy Number",
    INSURANCE_VALIDITY:"Insurance Validity",

    PUC_NUMBER:"PUC Number",
    PUC_UPTO:"PUC Valid Until",

    HYPOTHECATION:"Hypothecation",

    REGISTRATION_DATE:"Registration Date",
    REGISTRATION_VALIDITY:"Registration Validity",

    ADDRESS:"Registered Address",

    EMISSION_NORM:"Emission Norm",
    TAX_UPTO:"Tax Valid Until",
    VEHICLE_AGE:"Vehicle Age",

    DETAIL_BY:"Details Prepared By"

};


/* =========================================================
   UTILITY
========================================================= */

function esc(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function val(value){

    if(
        value === null ||
        value === undefined ||
        String(value).trim() === ""
    ){
        return "NA";
    }

    return String(value);

}


function fieldLabel(key){

    if(LABELS[key]){
        return LABELS[key];
    }

    return key
        .replace(/_/g," ")
        .toLowerCase()
        .replace(/\b\w/g,c=>c.toUpperCase());

}


/* =========================================================
   DIRECT TEXT ROW
========================================================= */

function row(key,value){

    const v=val(value);

    const isNA=
        v.trim().toUpperCase()==="NA";

    return `

        <div class="info-row">

            <div class="info-label">
                ${esc(fieldLabel(key))}
            </div>

            <div
                class="info-value ${isNA?"na":""}"
            >
                ${esc(v)}
            </div>

        </div>

    `;

}


/* =========================================================
   SECTION
========================================================= */

function section(number,title,keys,data){

    const existing=
        keys.filter(
            k =>
            Object.prototype.hasOwnProperty
            .call(data,k)
        );

    if(!existing.length){
        return "";
    }

    return `

        <div class="section">

            <div class="section-heading">

                <span class="section-number">
                    ${number}
                </span>

                <span class="section-title">
                    ${esc(title)}
                </span>

            </div>

            ${existing
                .map(k=>row(k,data[k]))
                .join("")
            }

        </div>

    `;

}


/* =========================================================
   BUILD PDF
========================================================= */

function buildPDF(data){

    const reg=val(data.REGISTRATION_NUMBER);

    const maker=val(data.MAKER);

    const model=val(data.MODEL);


    const known=Object.keys(LABELS);

    const extra=
        Object.keys(data)
        .filter(
            k=>!known.includes(k)
        );


    return `

    <div class="pdf">

        <div class="top-line"></div>


        <!-- HEADER -->

        <div class="pdf-header">

            <div class="header-inner">

                <div>

                    <div class="header-kicker">
                        Vehicle Information • Premium Report
                    </div>

                    <div class="header-title">
                        VEHICLE PROFILE
                    </div>

                    <div class="header-subtitle">
                        Structured vehicle data statement
                    </div>

                </div>


                <div class="registration">

                    <div class="registration-label">
                        Registration Number
                    </div>

                    <div class="registration-number">
                        ${esc(reg)}
                    </div>

                    <div class="registration-rule"></div>

                </div>

            </div>

        </div>


        <!-- VEHICLE HERO -->

        <div class="vehicle-hero">

            <div class="hero-row">

                <div>

                    <div class="hero-label">
                        Vehicle
                    </div>

                    <div class="hero-model">
                        ${esc(model)}
                    </div>

                    <div class="hero-maker">
                        ${esc(maker)}
                    </div>

                </div>


                <div class="hero-side">

                    <div>
                        FUEL:
                        <strong>
                            ${esc(val(data.FUEL_TYPE))}
                        </strong>
                    </div>

                    <div>
                        COLOUR:
                        <strong>
                            ${esc(val(data.COLOUR))}
                        </strong>

/* =========================================================
   GET JSON
========================================================= */

function getData(){

    const raw=
        document.getElementById("jsonInput")
        .value
        .trim();

    if(!raw){
        throw new Error(
            "Please paste vehicle JSON first."
        );
    }

    let data;

    try{

        data=JSON.parse(raw);

    }
    catch(error){

        throw new Error(
            "Invalid JSON. Please check quotes, commas and brackets."
        );

    }

    if(
        typeof data !== "object" ||
        data === null ||
        Array.isArray(data)
    ){

        throw new Error(
            "JSON must be a valid object."
        );

    }

    return data;

}


/* =========================================================
   FORMAT
========================================================= */

function formatJSON(){

    const status=
        document.getElementById("status");

    try{

        const data=getData();

        document.getElementById("jsonInput")
            .value=
            JSON.stringify(data,null,4);

        status.textContent=
            "JSON formatted successfully";

        status.className="ok";

    }
    catch(error){

        status.textContent=
            error.message;

        status.className="error";

    }

}


/* =========================================================
   CLEAR
========================================================= */

function clearJSON(){

    document.getElementById("jsonInput")
        .value="";

    const status=
        document.getElementById("status");

    status.textContent="Ready";

    status.className="";

}


/* =========================================================
   GENERATE PDF
========================================================= */

async function generatePDF(){

    const loader=
        document.getElementById("loader");

    const status=
        document.getElementById("status");

    try{

        const data=getData();

        loader.classList.add("show");

        status.textContent=
            "Building premium single-page layout...";


        const root=
            document.getElementById("pdfRoot");

        root.innerHTML=
            buildPDF(data);


        await new Promise(
            resolve=>setTimeout(resolve,350)
        );


        const page=
            root.querySelector(".pdf");


        /*
          Render at 2x resolution.
          The PDF itself remains exactly one A4 page.
        */

        const canvas=
            await html2canvas(
                page,
                {
                    width:794,
                    height:1123,
                    scale:2,
                    backgroundColor:"#fbfaf7",
                    useCORS:true,
                    logging:false
                }
            );


        status.textContent=
            "Finalizing PDF...";


        const {
            jsPDF
        }=window.jspdf;


        const pdf=
            new jsPDF(
                {
                    orientation:"portrait",
                    unit:"mm",
                    format:"a4",
                    compress:true
                }
            );


        const image=
            canvas.toDataURL(
                "image/jpeg",
                .97
            );


        pdf.addImage(
            image,
            "JPEG",
            0,
            0,
            210,
            297,
            undefined,
            "FAST"
        );


        let reg=
            val(data.REGISTRATION_NUMBER)
            .replace(
                /[^a-zA-Z0-9_-]/g,
                "_"
            );


        pdf.save(
            "Vehicle_Report_"+reg+".pdf"
        );


        status.textContent=
            "Single-page premium PDF generated ✓";

        status.className="ok";

    }
    catch(error){

        console.error(error);

        status.textContent=
            error.message ||
            "PDF generation failed";

        status.className="error";

        alert(
            error.message ||
            "Unable to generate PDF."
        );

    }
    finally{

        setTimeout(
            ()=>{
                loader.classList.remove("show");
            },
            350
        );

    }

}


/* =========================================================
   CTRL + ENTER
========================================================= */

document
    .getElementById("jsonInput")
    .addEventListener(
        "keydown",
        function(e){

            if(
                (e.ctrlKey || e.metaKey) &&
                e.key==="Enter"
            ){

                e.preventDefault();

                generatePDF();

            }

        }
    );

</script>
